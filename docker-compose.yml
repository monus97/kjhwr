# Development setup: hot-reloading backend + Vite dev server with /api proxied.
#   docker compose up --build        -> http://localhost:5173
services:
  api:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ./backend:/srv
    environment:
      DATA_DIR: /srv/data
      CORS_ORIGINS: "*"
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /ui
    volumes:
      - ./frontend:/ui
      - web_node_modules:/ui/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"
    environment:
      API_PROXY_TARGET: "http://api:8000"   # Vite proxies /api -> backend container
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  web_node_modules:
